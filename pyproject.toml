[project]
name = "farmermaxxing"
version = "0.1.0"
description = "Agent for the Kaggle Kaggriculture simulation competition"
requires-python = ">=3.12"
dependencies = [
    # Pinned: the engine is under active development and rule changes land weekly.
    # `make check-engine` diffs this pin against upstream master.
    "kaggle-environments==1.32.4",
    "wandb>=0.28.1",
    "modal>=1.5.3",
    "kaggle>=1.7.0",
    "cma==4.4.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer-running checks (timing, full episodes)",
    # Validate the BUILT submission.tar.gz. Separate from `slow` because these
    # must run AFTER the tar, and `make bundle` depends on `make check` -- so
    # including them in `check` makes the tarball tests fail on a stale archive
    # and block the very command that would refresh it.
    "bundle: assertions about the built submission.tar.gz",
]
addopts = "-m 'not slow and not bundle'"
